#
# Put the watchdog test's cross-reset state (m_state, m_testcase_index,
# m_testvalue, m_magic) in a dedicated section so the board linker fragment
# (sf32lb52_devkit_lcd.ld) can back it at a fixed SRAM address that the SFBL
# bootloader does not re-initialise on every boot.
CONFIG_TEST_WDT_NOINIT_SECTION=".wdt_test_state"
