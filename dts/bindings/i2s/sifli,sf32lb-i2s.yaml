description: |
  SiFli SF32LB I2S (Inter-IC Sound) controller.

  The SF32LB I2S peripheral supports standard I2S, Left-Justified,
  Right-Justified, and DSP/PCM serial audio formats in both master
  and slave modes. It features independent TX and RX paths with
  programmable BCLK/LRCK dividers, DMA support, and a 10-band
  TX equalizer.

compatible: "sifli,sf32lb-i2s"

include: [i2s-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  interrupts:
    required: true

  dmas:
    description: |
      Optional DMA channel specifiers for TX and RX. When provided,
      the driver will use DMA for data transfers. Two channels are
      expected: one for TX and one for RX, in that order.
      Example:
        dmas = <&dmac 0 SF32LB52X_DMA_REQ_I2S1_TX SF32LB_DMA_PL_HIGH>,
               <&dmac 0 SF32LB52X_DMA_REQ_I2S1_RX SF32LB_DMA_PL_HIGH>;

  dma-names:
    description: |
      Must be "tx" and "rx" when dmas is present.

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true
