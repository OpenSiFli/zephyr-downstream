# SF32LB52 DevKit LCD board configuration for Bluetooth Classic SPP server

CONFIG_BT_BUF_ACL_RX_SIZE=512
CONFIG_BT_BUF_ACL_TX_SIZE=512
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_L2CAP_TX_MTU=204
CONFIG_BT_RFCOMM_L2CAP_MTU=200
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_CRC_HW_HANDLER=n
CONFIG_SHELL=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_CACHE_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_SPI=y
CONFIG_FLASH_SF32LB_MPI_QSPI_NOR=y
CONFIG_SPI_NOR=n
